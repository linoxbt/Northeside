# Netlify: Next.js app in a pnpm monorepo. In the Netlify UI, leave the base directory empty and
# set the package directory to apps/web. Paths below are relative to the base directory (the repo
# root), as Netlify's monorepo support resolves them. The Next.js runtime is detected automatically.
[build]
  command = "pnpm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  directory = "apps/web/netlify/functions"
  # ops-worker imports the TypeScript workspace packages; esbuild bundles them.
  node_bundler = "esbuild"

# Android app download and Digital Asset Links (served as static files from apps/web/public).
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
