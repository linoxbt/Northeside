name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository (audit 27 Nov, ops 10).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with: { version: v1.7.1 }
      - run: forge fmt --check
      # Size limits apply to deployed contracts only: scripts and tests are never deployed.
      - run: forge build --sizes --skip test --skip script
      # QIE mainnet rejects Cancun opcodes (TSTORE, MCOPY): fail if any compiled contract uses one.
      - run: node script/check-opcodes.mjs
      - run: forge test -vv
        env: { FOUNDRY_PROFILE: ci }
      - uses: crytic/slither-action@4fd765aeef19915d04ddf0be90c2930036a774d8 # v0.4.1
        with:
          target: contracts
          slither-args: --filter-paths "node_modules|test|script" --exclude timestamp
          fail-on: medium

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # anvil + contract artifacts so the end-to-end pipeline test runs instead of skipping
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with: { version: v1.7.1 }
      - run: forge build
        working-directory: contracts
      - run: pnpm -r typecheck
      - run: pnpm exec eslint .
      - run: pnpm test
      # Known-vulnerable production dependencies fail the build (high and above).
      - run: pnpm audit --prod --audit-level high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @northeside/web typecheck
      - run: pnpm --filter @northeside/web test
      - run: pnpm --filter @northeside/web build
        env:
          NEXT_PUBLIC_CHAIN_ID: "1990"
          NEXT_PUBLIC_MATCHWEEKS_ADDRESS: "0x0000000000000000000000000000000000000001"
          NEXT_PUBLIC_HOST_REWARDS_ADDRESS: "0x0000000000000000000000000000000000000002"
          NEXT_PUBLIC_IDENTITY_ADDRESS: "0x0000000000000000000000000000000000000003"
          NEXT_PUBLIC_QUSDC_ADDRESS: "0x0000000000000000000000000000000000000004" # placeholder; real addresses come from Netlify
