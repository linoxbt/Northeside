name: E2E

# The 66-check end-to-end run (local chain, Postgres, the real UI in Chromium). Nightly and on demand:
# it takes several minutes, so it does not gate every push (audit 27 Nov, ops 5).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with: { version: v1.7.1 }
      - run: forge build
        working-directory: contracts
      # The app's assumptions against the contracts actually deployed on QIE mainnet (forked).
      - run: forge test --match-contract MainnetForkTest -vv
        working-directory: contracts
        env: { FORK_MAINNET: "1" }
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: node apps/web/e2e/run.mjs
        env:
          DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:54329/postgres
          OUT: ${{ runner.temp }}/e2e
